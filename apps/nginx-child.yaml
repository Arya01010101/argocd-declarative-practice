
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-child
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Arya01010101/argocd-declarative-practice.git
    targetRevision: main
    path: apps/nginx-manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
